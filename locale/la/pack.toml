# Triga library-owned locale fragment — Latin reader surface for the
# English-first canonical names (task 4257bdde, operator ruling on 8acd975f).
#
# The la pack is an identity pack, so members install as-written; these rows
# add the Latin surface projections for members whose canonical names became
# English in the triga polish wave. La readers keep writing `math.normata`,
# `scene.insere`, `base.materia_ex_nomine`, etc.; each row maps the la
# spelling back to the English canonical. Rows cover every renamed exported
# member of the public classes and free functions across the nine touched
# leaf modules (math, scene, resource, geometry/data, geometry/attribute,
# graph/camera, material/base, material/basic, and the scene facade types).
#
# Loaded from `<triga>/locale/la/pack.toml` by the library-fragment merge
# when a `la` consumer imports `triga:*` modules.

[pack]
id = "la"
schema_version = 1

