[package]
name = "triga"
version = "0.3.0"
edition = "2026"

[library]
provider = "triga"

[paths]
source = "src"

[build]
kind = "lib"
targets = ["rust", "ts"]

# Faber emit -t wgsl-text reads this table from imported libraries.
[target.wgsl-text]
bindings = "bindings/wgsl.toml"

[locale]
locale = "en"
