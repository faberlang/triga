# Triga WGSL binding manifest.
#
# The compiler emits these spellings; it does not validate them as WGSL
# names. Schema: `[functions.<route>]`, `[types.<route>]` and
# `[annotations.<route>]`, each with `symbol`.

[annotations."triga:shader.Vertex"]
symbol = "vertex"

[annotations."triga:shader.Fragment"]
symbol = "fragment"

[annotations."triga:shader.Position"]
symbol = "builtin(position)"

[types."triga:shader.Texture2D"]
symbol = "texture_2d<f32>"

[types."triga:shader.Sampler"]
symbol = "sampler"

[functions."triga:shader.sample"]
symbol = "textureSample"
